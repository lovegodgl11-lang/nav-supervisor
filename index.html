<!DOCTYPE html>
<html lang="en" class=""><head><script>window.livecodes = window.livecodes || {};</script><title>Nav supervisor </title><meta name="title" content="Nav supervisor "><meta name="description" content="Inbox plus voice msg "><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js" async=""></script><script type="importmap">{
  "imports": {}
}</script></head><body>



    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervisor Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .status-badge { font-size: 0.75rem; padding: 0.25rem 0.75rem; border-radius: 9999px; font-weight: 600; }
        .countdown-overdue { color: #ef4444; font-weight: bold; }
        #notification-badge, #inbox-badge { top: -4px; right: -4px; }
        .notification-dropdown { display: none; }
        .notification-dropdown.show { display: block; }
        .notification-item.unread { background-color: #eef2ff; }
        .hidden { display: none; }
    </style>


    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Supervisor Dashboard</h1>
            <div class="flex items-center gap-4">
                <div class="relative">
                    <button id="notification-bell" class="relative text-gray-600 hover:text-indigo-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                        <span id="notification-badge" class="absolute bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center hidden"></span>
                    </button>
                    <div id="notification-dropdown" class="absolute right-0 mt-2 w-80 bg-white rounded-lg shadow-xl hidden z-20 border max-h-96 overflow-y-auto">
                        <!-- Notifications will be rendered here -->
                    </div>
                </div>
                 <div class="relative">
                    <button id="inbox-icon" class="relative text-gray-600 hover:text-indigo-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                        <span id="inbox-badge" class="absolute bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center hidden"></span>
                    </button>
                </div>
                <a href="Pc.html" class="text-sm font-semibold text-indigo-600 hover:text-indigo-800">← Project Hub</a>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Main Orders Table -->
            <div class="lg:col-span-2 bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-bold mb-4">Active Orders</h2>
                <div class="max-h-[70vh] overflow-y-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-gray-700 uppercase bg-gray-50 sticky top-0">
                            <tr>
                                <th class="px-4 py-3">Token</th>
                                <th class="px-4 py-3">Customer</th>
                                <th class="px-4 py-3">Task</th>
                                <th class="px-4 py-3">Assign Worker</th>
                                <th class="px-4 py-3">Task Status</th>
                                <th class="px-4 py-3">ETA</th>
                            </tr>
                        </thead>
                        <tbody id="orders-tbody">
                            <!-- Order rows will be injected here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Worker Status -->
            <div class="lg:col-span-1 bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-bold mb-4">Worker Status</h2>
                <div id="worker-status-list" class="space-y-3">
                    <!-- Worker status cards will be injected here -->
                </div>
            </div>
        </div>
    </div>
    
    <div id="toast" class="hidden fixed bottom-5 right-5 bg-gray-900 text-white py-2 px-4 rounded-lg shadow-lg"></div>

    <div id="inbox-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex justify-center items-center p-4 hidden">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-lg flex flex-col max-h-[80vh]">
            <div class="p-4 border-b flex justify-between items-center">
                <h3 class="text-lg font-bold">Message Inbox</h3>
                <button id="inbox-close-btn" class="text-gray-500 hover:text-gray-800 text-2xl">×</button>
            </div>
            <div id="inbox-list" class="overflow-y-auto p-2">
                <!-- Messages will be rendered here as a table -->
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC0_DQIiyaVQllFH4pxH1Dm3r2kFXXoOgc",
            authDomain: "navrosetailorapp.firebaseapp.com",
            databaseURL: "https://navrosetailorapp-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "navrosetailorapp"
        };
        
        let db;
        let workers = [];
        let workerTasks = {};
        let countdownIntervals = {};
        let notifications = [];
        let unreadCount = 0;
        let inboxUnreadCount = 0;

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 4000);
        }

        function speak(text) {
            if (!('speechSynthesis' in window)) return;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-IN';
            speechSynthesis.speak(utterance);
        }
        
        function addNotification(message, options = {}) {
            notifications.unshift({ id: Date.now(), message, read: false, timestamp: new Date(), ...options });
            unreadCount++;
            inboxUnreadCount++;
            updateNotificationUI();
            updateInboxBadge();
            renderInbox();
            speak(message);
        }

        function updateNotificationUI() {
            const badge = document.getElementById('notification-badge');
            badge.textContent = unreadCount;
            badge.classList.toggle('hidden', unreadCount === 0);
            renderNotifications();
        }
        
        function renderNotifications() {
            const dropdown = document.getElementById('notification-dropdown');
            if (notifications.length === 0) {
                dropdown.innerHTML = `<p class="p-4 text-center text-sm text-gray-500">No notifications</p>`;
            } else {
                 dropdown.innerHTML = notifications.map(n => `
                    <div class="p-3 border-b text-sm ${!n.read ? 'unread font-semibold' : 'text-gray-600'}">
                        ${n.message}
                    </div>
                `).join('');
            }
        }

        function updateInboxBadge() {
            const badge = document.getElementById('inbox-badge');
            badge.textContent = inboxUnreadCount;
            badge.classList.toggle('hidden', inboxUnreadCount === 0);
        }

        function renderInbox() {
            const inboxList = document.getElementById('inbox-list');
            if (notifications.length === 0) {
                inboxList.innerHTML = `<p class="p-8 text-center text-gray-500">Your inbox is empty.</p>`;
                return;
            }
            inboxList.innerHTML = `
                <table class="w-full text-sm">
                    <tbody>
                        ${notifications.map(n => `
                            <tr class="border-b hover:bg-gray-50">
                                <td class="p-3">
                                    <p class="${!n.read ? 'font-semibold' : ''}">${n.message}</p>
                                    <p class="text-xs text-gray-500">${n.timestamp.toLocaleString()}</p>
                                </td>
                                <td class="p-3 text-right">
                                    <button onclick="deleteNotification(${n.id})" class="text-red-500 hover:text-red-700 text-xs font-semibold">Remove</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }
        
        function deleteNotification(id) {
            const index = notifications.findIndex(n => n.id === id);
            if (index > -1) {
                notifications.splice(index, 1);
                unreadCount = notifications.filter(n => !n.read).length;
                inboxUnreadCount = unreadCount;
                updateNotificationUI();
                updateInboxBadge();
                renderInbox();
            }
        }

        function displayOrders(queueData) {
            const tbody = document.getElementById('orders-tbody');
            
            Object.values(countdownIntervals).forEach(clearInterval);
            countdownIntervals = {};
            
            const activeOrders = Object.values(queueData).filter(o => o.status === 'serving' || o.status === 'waiting');
            if (activeOrders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center p-8 text-gray-500">No active customers in the queue.</td></tr>';
                return;
            }
            
            const sortedOrders = activeOrders.sort((a,b) => a.tokenNumber - b.tokenNumber);
            
            const rowsHtml = sortedOrders.map(order => {
                const task = Object.values(workerTasks).find(t => t.orderId === order.id);
                const workerOptions = workers.map(w => `<option value="${w.id}" ${task?.assignedTo === w.id ? 'selected' : ''}>${w.name}</option>`).join('');
                
                let taskStatus = 'Not Assigned';
                let statusClass = 'bg-gray-200 text-gray-800';
                let etaHtml = '--';

                if (task) {
                    taskStatus = task.status;
                    if (task.status === 'Completed') {
                        etaHtml = `<span class="font-bold text-green-600">Completed!</span>`;
                    } else if (task.eta && task.etaSetTimestamp) {
                        etaHtml = `<div id="countdown-${task.orderId}" class="font-semibold text-lg">--:--</div>`;
                    }

                    switch (task.status) {
                        case 'Pending': statusClass = 'bg-yellow-200 text-yellow-800'; break;
                        case 'In Progress': statusClass = 'bg-blue-200 text-blue-800'; break;
                        case 'Completed': statusClass = 'bg-green-200 text-green-800'; break;
                    }
                }

                return `
                    <tr class="border-b">
                        <td class="px-4 py-3 font-bold text-lg">${order.tokenNumber}</td>
                        <td class="px-4 py-3">${order.customerName}</td>
                        <td class="px-4 py-3 text-gray-600">${order.appointmentFor}</td>
                        <td class="px-4 py-3">
                            <select onchange="assignTask('${order.id}', this.value, '${order.customerName}', '${order.appointmentFor}')" class="w-full p-1 border rounded-md text-sm" ${task ? 'disabled' : ''}>
                                <option value="">Assign to...</option>
                                ${workerOptions}
                            </select>
                        </td>
                        <td class="px-4 py-3"><span class="status-badge ${statusClass}">${taskStatus}</span></td>
                        <td class="px-4 py-3">${etaHtml}</td>
                    </tr>
                `;
            }).join('');

            tbody.innerHTML = rowsHtml;

            // NOW start the countdowns after elements are in the DOM
            sortedOrders.forEach(order => {
                const task = Object.values(workerTasks).find(t => t.orderId === order.id);
                if (task && task.status !== 'Completed' && task.eta && task.etaSetTimestamp) {
                    startCountdown(task.orderId, task.eta, task.etaSetTimestamp);
                }
            });
        }

        function startCountdown(orderId, etaMinutes, etaSetTimestamp) {
            const countdownEl = document.getElementById(`countdown-${orderId}`);
            if (!countdownEl) {
                if (countdownIntervals[orderId]) {
                    clearInterval(countdownIntervals[orderId]);
                    delete countdownIntervals[orderId];
                }
                return;
            }

            const updateCountdown = () => {
                const liveTask = Object.values(workerTasks).find(t => t.orderId === orderId);

                if (liveTask && liveTask.status === 'Completed') {
                    countdownEl.textContent = "Completed!";
                    countdownEl.classList.remove('countdown-overdue');
                    clearInterval(countdownIntervals[orderId]);
                    delete countdownIntervals[orderId];
                    return;
                }

                const totalSeconds = etaMinutes * 60;
                const elapsedSeconds = (Date.now() - etaSetTimestamp) / 1000;
                const remainingSeconds = totalSeconds - elapsedSeconds;

                if (remainingSeconds <= 0) {
                    countdownEl.textContent = "Overdue";
                    countdownEl.classList.add('countdown-overdue');
                    clearInterval(countdownIntervals[orderId]);
                    delete countdownIntervals[orderId];
                } else {
                    const minutes = Math.floor(remainingSeconds / 60);
                    const seconds = Math.floor(remainingSeconds % 60);
                    countdownEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                    countdownEl.classList.remove('countdown-overdue');
                }
            };

            if (countdownIntervals[orderId]) {
                clearInterval(countdownIntervals[orderId]);
            }

            updateCountdown();
            countdownIntervals[orderId] = setInterval(updateCountdown, 1000);
        }


        function displayWorkers(workerData, taskData) {
            const list = document.getElementById('worker-status-list');
            list.innerHTML = '';
            workers = Object.values(workerData);

            if (workers.length === 0) {
                list.innerHTML = '<p class="text-center text-gray-500">No workers registered.</p>';
                return;
            }
            
            workers.forEach(worker => {
                const assignedTask = Object.values(taskData).find(t => t.assignedTo === worker.id && t.status === 'In Progress');
                const status = assignedTask ? 'Busy' : 'Available';
                const statusClass = assignedTask ? 'text-red-600' : 'text-green-600';
                
                const card = `
                    <div class="p-3 border rounded-lg">
                        <div class="flex justify-between items-center">
                            <span class="font-semibold">${worker.name}</span>
                            <span class="text-sm font-bold ${statusClass}">${status}</span>
                        </div>
                        ${assignedTask ? `<p class="text-xs text-gray-500 mt-1">Working on: ${assignedTask.customerName}'s ${assignedTask.details}</p>` : ''}
                    </div>
                `;
                list.innerHTML += card;
            });
        }

        async function assignTask(orderId, workerId, customerName, details) {
            if (!workerId) return;
            const workerName = workers.find(w=>w.id === workerId)?.name || 'a worker';

            const task = {
                orderId: orderId,
                assignedTo: workerId,
                customerName: customerName,
                details: details,
                status: 'Pending', // Pending, In Progress, Completed
                eta: null,
                etaSetTimestamp: null,
                delayReason: null,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            };

            try {
                const newTaskRef = db.ref('workerTasks').push();
                await newTaskRef.set(task);
                showToast(`Task assigned to ${workerName}`);
                speak(`New task for ${workerName}: ${details} for ${customerName}.`);
            } catch (error) {
                console.error("Error assigning task:", error);
                showToast("Failed to assign task.");
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.database();

                db.ref().on('value', (snapshot) => {
                    const data = snapshot.val() || {};
                    const queueData = data.tokenQueue || {};
                    const workerData = data.workers || {};
                    const taskData = data.workerTasks || {};

                    // --- AUTOMATIC NOTIFICATION CLEANUP ---
                    const activeOrderIds = new Set(Object.values(queueData).filter(o => o.status === 'serving' || o.status === 'waiting').map(o => o.id));
                    const originalNotifCount = notifications.length;
                    notifications = notifications.filter(n => !n.orderId || activeOrderIds.has(n.orderId));
                    if (notifications.length < originalNotifCount) {
                        unreadCount = notifications.filter(n => !n.read).length;
                        inboxUnreadCount = unreadCount;
                        updateNotificationUI();
                        updateInboxBadge();
                        renderInbox();
                    }
                    // --- END CLEANUP ---
                    
                    const previousTasks = { ...workerTasks };
                    workerTasks = taskData;
                    
                    displayWorkers(workerData, taskData);
                    displayOrders(queueData);
                    
                    // Check for notifications
                    Object.keys(workerTasks).forEach(taskId => {
                        const currentTask = workerTasks[taskId];
                        const previousTask = previousTasks[taskId];
                        const workerName = (workers.find(w => w.id === currentTask.assignedTo) || {}).name || 'A worker';

                        // New completion
                        if (currentTask.status === 'Completed' && previousTask?.status !== 'Completed') {
                            const message = `${workerName} has completed ${currentTask.customerName}'s ${currentTask.details} order.`;
                            addNotification(message, { orderId: currentTask.orderId });
                        }

                        // New delay reason
                        if (currentTask.delayReason && currentTask.delayReason !== previousTask?.delayReason) {
                            const message = `Delay from ${workerName} for ${currentTask.customerName}'s order: ${currentTask.delayReason}.`;
                            addNotification(message, { orderId: currentTask.orderId });
                        }
                        
                        // Check if task just became overdue
                        if (currentTask.eta && currentTask.etaSetTimestamp) {
                            const totalSeconds = currentTask.eta * 60;
                            const elapsedSeconds = (Date.now() - currentTask.etaSetTimestamp) / 1000;
                            if (totalSeconds - elapsedSeconds < 0 && previousTask) {
                                const prevElapsed = (Date.now() - (previousTask.etaSetTimestamp || 0)) / 1000;
                                if ((previousTask.eta * 60) - prevElapsed >= 0) { // Was not overdue before
                                     const message = `Task for ${currentTask.customerName} assigned to ${workerName} is now overdue.`;
                                     addNotification(message, { orderId: currentTask.orderId });
                                }
                            }
                        }
                    });
                });
                
                // Notification Bell Listener
                const bell = document.getElementById('notification-bell');
                const dropdown = document.getElementById('notification-dropdown');
                bell.addEventListener('click', (e) => {
                    e.stopPropagation();
                    dropdown.classList.toggle('show');
                    if (dropdown.classList.contains('show')) {
                        unreadCount = 0;
                        notifications.forEach(n => n.read = true);
                        updateNotificationUI();
                    }
                });
                document.addEventListener('click', (e) => {
                    if (!bell.contains(e.target) && !dropdown.contains(e.target)) {
                        dropdown.classList.remove('show');
                    }
                });
                
                 // Inbox Listeners
                const inboxIcon = document.getElementById('inbox-icon');
                const inboxModal = document.getElementById('inbox-modal');
                const inboxCloseBtn = document.getElementById('inbox-close-btn');

                inboxIcon.addEventListener('click', () => {
                    inboxModal.classList.remove('hidden');
                    inboxUnreadCount = 0;
                    updateInboxBadge();
                });

                inboxCloseBtn.addEventListener('click', () => {
                    inboxModal.classList.add('hidden');
                });
                
            } catch (e) {
                console.error("Firebase initialization failed:", e);
                alert("Could not connect to the database. The app will not work.");
            }
        });

        window.assignTask = assignTask;
        window.deleteNotification = deleteNotification;
    </script>


<script src="./script.js"></script></body></html>
